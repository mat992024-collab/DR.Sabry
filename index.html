<style>
  :root { --gold: #d4af37; --gold-soft: #f1d98a; --emerald: #2fbf9b; }
  html, body { margin: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Cairo', system-ui, sans-serif;
    min-height: 100vh; min-height: 100dvh;
    color: #f4efe0;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(212,175,55,.16), transparent 60%),
      radial-gradient(700px 500px at -10% 40%, rgba(47,191,155,.12), transparent 60%),
      radial-gradient(800px 600px at 50% 120%, rgba(212,175,55,.10), transparent 60%),
      linear-gradient(180deg, #05151a 0%, #08242b 55%, #061a20 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }

  /* Pharmacy doodles background */
  .deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .deco svg { position: absolute; fill: none; stroke: var(--gold); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .13; animation: floaty 9s ease-in-out infinite; }
  .deco svg.em { stroke: var(--emerald); opacity: .12; }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(var(--r,0deg)); } 50% { transform: translateY(-14px) rotate(calc(var(--r,0deg) + 4deg)); } }

  .glass {
    background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
    border: 1px solid rgba(212,175,55,.28);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 20px 50px -20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
  }

  .gold-text { background: linear-gradient(90deg, #f1d98a, #d4af37 50%, #f1d98a); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .btn-gold {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #f1d98a 0%, #d4af37 45%, #b8932a 100%);
    color: #1a1405; font-weight: 800;
    box-shadow: 0 10px 30px -8px rgba(212,175,55,.55), inset 0 1px 0 rgba(255,255,255,.5);
    animation: pulseGlow 2.8s ease-in-out infinite;
    transition: transform .15s ease;
  }
  .btn-gold::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
    transform: skewX(-20deg); animation: shine 3.6s ease-in-out infinite;
  }
  @keyframes shine { 0% { left: -60%; } 55%,100% { left: 130%; } }
  @keyframes pulseGlow { 0%,100% { box-shadow: 0 10px 30px -8px rgba(212,175,55,.5), inset 0 1px 0 rgba(255,255,255,.5); } 50% { box-shadow: 0 14px 40px -6px rgba(212,175,55,.8), inset 0 1px 0 rgba(255,255,255,.5); } }
  .btn:active { transform: scale(.97); }

  .ring {
    background: conic-gradient(from 0deg, #f1d98a, #2fbf9b, #d4af37, #f1d98a);
    animation: spin 8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .fade-up { opacity: 0; transform: translateY(16px); animation: fadeUp .7s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes fadeUp { to { opacity: 1; transform: none; } }

  .social {
    width: 100%; aspect-ratio: 1; display: grid; place-items: center; border-radius: 18px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(212,175,55,.25);
    transition: transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .social:active { transform: scale(.94); }
  .social:hover { background: rgba(212,175,55,.14); border-color: rgba(212,175,55,.6); }
  .ico { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .ico-fill { fill: currentColor; stroke: none; }

  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 30px);
    background: rgba(8,32,42,.95); border: 1px solid rgba(212,175,55,.5); color: #f1d98a;
    padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none;
    transition: all .3s ease; z-index: 50; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .fade-up { opacity: 1; transform: none; }
  }
</style>

<script>
/* ============================================================
   ⚙️ إعدادات الكارت — عدّل هنا فقط
   اترك أي رابط فارغًا '' ولن يظهر زره في الكارت
   ============================================================ */
const CARD = {
  phone: '201068959026',          // بصيغة دولية بدون +
  email: '',                      // اختياري — يُضاف للـ vCard لو اتكتب
  photo: '',                      // اختياري — رابط صورة شخصية (بدل أيقونة الهاون)
  geo: { lat: 31.213239, lng: 29.994006 },
  links: {
    facebook:  'https://www.facebook.com/share/1FGBK143n4/?mibextid=wwXIfr',
    instagram: '',
    linkedin:  '',
    youtube:   '',
    website:   ''
  },
  ar: {
    first: 'صبري ربيع', last: 'يحيى', full: 'صبري ربيع يحيى',
    title: 'دكتور صيدلي عام',
    org: 'رعاية صحية لصيدليات المجتمع',
    bio: 'صيدلي متخصص في تقديم الرعاية الصحية لصيدليات المجتمع',
    waText: 'السلام عليكم دكتور صبري، تواصلت معك من الكارت الشخصي.'
  },
  en: {
    first: 'Sabry Rabie', last: 'Yahia', full: 'Sabry Rabie Yahia',
    title: 'General Pharmacist (Dr.)',
    org: 'Community Pharmacy Healthcare',
    bio: 'A pharmacist specialized in delivering healthcare services to community pharmacies.',
    waText: 'Hello Dr. Sabry, I\'m contacting you from your digital business card.'
  }
};

const UI = {
  ar: { share:'مشاركة الكارت 🔗', save:'حفظ جهة الاتصال 📥', whatsapp:'واتساب', location:'الموقع',
        follow:'تابعني على', footer:'بطاقة رقمية • الرعاية الصحية في متناول يدك',
        saved:'تم تجهيز جهة الاتصال ✔️ افتح الملف لحفظه', copied:'تم نسخ رابط الكارت 📋', shareFail:'تعذّرت المشاركة' },
  en: { share:'Share Card 🔗', save:'Save Contact 📥', whatsapp:'WhatsApp', location:'Location',
        follow:'Follow me', footer:'Digital card • Healthcare at your fingertips',
        saved:'Contact ready ✔️ Open the file to save it', copied:'Card link copied 📋', shareFail:'Sharing failed' }
};

UI.ar.qrHint = 'امسح الكود بكاميرا الموبايل لفتح الكارت أو حفظ جهة الاتصال';
UI.en.qrHint = 'Scan with your phone camera to open the card or save the contact';

const SOCIAL_META = {
  facebook:  { label:'Facebook',  color:'#4c8bf5', svg:'<svg class="ico ico-fill" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>' },
  instagram: { label:'Instagram', color:'#ee6aa7', svg:'<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>' },
  linkedin:  { label:'LinkedIn',  color:'#4a9fe0', svg:'<svg class="ico ico-fill" viewBox="0 0 24 24"><path d="M4.98 3.5a2.5 2.5 0 11-.001 5.001A2.5 2.5 0 014.98 3.5zM3 9h4v12H3zM9 9h3.8v1.7h.05C13.4 9.7 14.7 8.9 16.6 8.9 20.5 8.9 21 11.4 21 14.6V21h-4v-5.6c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9V21H9z"/></svg>' },
  youtube:   { label:'YouTube',   color:'#ff5a5a', svg:'<svg class="ico" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l6 3-6 3z" fill="currentColor"/></svg>' },
  website:   { label:'Website',   color:'#2fbf9b', svg:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>' }
};

/* ============================================================ */
let lang = 'ar';
try { lang = localStorage.getItem('card-lang') || ((navigator.language || 'ar').toLowerCase().startsWith('ar') ? 'ar' : 'en'); } catch (e) {}

const $ = (id) => document.getElementById(id);

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

function formatPhone() {
  const p = CARD.phone;
  // +20 10 6895 9026
  return '+' + p.slice(0, 2) + ' ' + p.slice(2, 4) + ' ' + p.slice(4, 8) + ' ' + p.slice(8);
}

function renderSocials() {
  const box = $('socials');
  box.innerHTML = '';
  const entries = Object.entries(CARD.links).filter(([, url]) => url && url.trim());
  if (!entries.length) { box.parentElement.classList.add('hidden'); return; }
  entries.forEach(([key, url]) => {
    const m = SOCIAL_META[key];
    if (!m) return;
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    a.setAttribute('aria-label', m.label);
    a.className = 'social';
    a.style.color = m.color;
    a.innerHTML = m.svg;
    box.appendChild(a);
  });
}

function applyLang(l) {
  lang = l;
  try { localStorage.setItem('card-lang', l); } catch (e) {}
  const d = CARD[l];
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (UI[l][k] !== undefined) el.textContent = UI[l][k];
    else if (d[k] !== undefined) el.textContent = d[k];
  });
  $('name').textContent = d.full;
  $('title').textContent = d.title;
  document.title = (l === 'ar' ? 'د. ' : 'Dr. ') + d.full;

  $('waBtn').href = 'https://wa.me/' + CARD.phone + '?text=' + encodeURIComponent(d.waText);
  $('mapBtn').href = 'https://www.google.com/maps?q=' + CARD.geo.lat + ',' + CARD.geo.lng;
  $('callBtn').href = 'tel:+' + CARD.phone;
  $('phoneText').textContent = formatPhone();
  $('qrHint').textContent = UI[l].qrHint;
  renderQR();

  const on = 'bg-gold-500 text-ink-900', off = 'text-stone-300';
  $('lang-ar').className = 'rounded-full px-3 py-1 transition ' + (l === 'ar' ? on : off);
  $('lang-en').className = 'rounded-full px-3 py-1 transition ' + (l === 'en' ? on : off);
}

/* ---------- vCard ---------- */
function esc(s) { return String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }

function buildVCard(l) {
  const d = CARD[l];
  const L = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'N;CHARSET=utf-8:' + esc(d.last) + ';' + esc(d.first) + ';;;',
    'FN;CHARSET=utf-8:' + esc(d.full),
    'TITLE;CHARSET=utf-8:' + esc(d.title),
    'ORG;CHARSET=utf-8:' + esc(d.org),
    'TEL;TYPE=CELL,VOICE,PREF:+' + CARD.phone
  ];
  if (CARD.email) L.push('EMAIL;TYPE=INTERNET,WORK:' + CARD.email);
  Object.values(CARD.links).forEach(u => { if (u && u.trim()) L.push('URL:' + u.trim()); });
  L.push('URL;TYPE=MAP:https://www.google.com/maps?q=' + CARD.geo.lat + ',' + CARD.geo.lng);
  L.push('GEO:' + CARD.geo.lat + ';' + CARD.geo.lng);
  L.push('NOTE;CHARSET=utf-8:' + esc(d.bio));
  L.push('END:VCARD');
  return L.join('\r\n');
}

function saveContact() {
  const blob = new Blob([buildVCard(lang)], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Sabry-Rabie-Yahia-' + lang + '.vcf';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(UI[lang].saved);
}

/* ---------- QR ---------- */
function qrSvg(text) {
  try {
    if (typeof qrcode === 'undefined') return '';
    try { qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8']; } catch (e) {}
    const qr = qrcode(0, 'M');
    qr.addData(text, 'Byte');
    qr.make();
    const n = qr.getModuleCount();
    let p = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) p += 'M' + c + ' ' + r + 'h1v1h-1z';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges" style="width:100%;height:100%;display:block"><path d="' + p + '" fill="#06191c"/></svg>';
  } catch (e) { return ''; }
}

function renderQR() {
  // لو الكارت مرفوع على رابط → الكود يفتح الرابط. لو ملف محلي → الكود يحفظ جهة الاتصال مباشرة
  const isWeb = /^https?:$/.test(location.protocol);
  const text = isWeb ? location.href.split('#')[0] : buildVCard(lang);
  const svg = qrSvg(text);
  $('qrMini').innerHTML = svg;
  $('qrBig').innerHTML = svg;
}

function toggleQR(show) {
  const m = $('qrModal');
  m.classList.toggle('hidden', !show);
  m.classList.toggle('flex', show);
}

/* ---------- Share ---------- */
async function shareCard() {
  const d = CARD[lang];
  const data = { title: d.full, text: d.full + ' — ' + d.title, url: location.href };
  try {
    if (navigator.share) { await navigator.share(data); return; }
    await navigator.clipboard.writeText(location.href);
    toast(UI[lang].copied);
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    try { await navigator.clipboard.writeText(location.href); toast(UI[lang].copied); }
    catch (_) { toast(UI[lang].shareFail); }
  }
}

/* ---------- Init ---------- */
if (CARD.photo) {
  const img = $('photo');
  img.src = CARD.photo; img.classList.remove('hidden');
  $('emblem').classList.add('hidden');
}
renderSocials();
applyLang(lang);

$('qrBtn').addEventListener('click', () => toggleQR(true));
$('qrClose').addEventListener('click', () => toggleQR(false));
$('qrModal').addEventListener('click', (e) => { if (e.target === $('qrModal')) toggleQR(false); });
$('saveBtn').addEventListener('click', saveContact);
$('shareBtn').addEventListener('click', shareCard);
$('lang-ar').addEventListener('click', () => applyLang('ar'));
$('lang-en').addEventListener('click', () => applyLang('en'));
</script>
</body>
